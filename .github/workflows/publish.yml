name: Publish to PyPI

on:
  push:
    branches: [ main ]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Publish to PyPI
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read # to fetch code (actions/checkout)
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            files.pythonhosted.org:443
            objects.githubusercontent.com:443
            github.com:443
            pypi.org:443
            api.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.15'

      - name: ⬇️ Install build dependencies
        run: |
          python -m pip install -U flit

      - name: 🏗️ Build
        run: python -m flit build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: ./dist

  # https://docs.pypi.org/trusted-publishers/using-a-publisher/
  publish-pypi:
    name: ⬆️ Upload release to PyPI
    environment: 'publish'
    if: github.repository_owner == 'torchbox' && github.event.action == 'published'
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write  # Mandatory for trusted publishing

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            - github.com:443
            - api.github.com:443
            - ghcr.io:443
            - pkg-containers.githubusercontent.com:443
            - pypi.org:443
            - upload.pypi.org:443
            - files.pythonhosted.org:443
            - fulcio.sigstore.dev:443
            - rekor.sigstore.dev:443
            - tuf-repo-cdn.sigstore.dev:443

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist

      - name: 🚀 Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          attestations: true
